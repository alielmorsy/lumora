<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumora</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
#canvas { display: block; width: 100vw; height: 100vh; border: 0; outline: none; touch-action: none; }
#status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; margin: 0;
          color: #ddd; font: 16px sans-serif; text-align: center; white-space: pre-wrap; pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<p id="status">Loading...</p>
<script>
var statusEl = document.getElementById('status');
function show(text) { statusEl.textContent = text; }
var Module = {
  canvas: document.getElementById('canvas'),
  setStatus: function (text) { if (!Module.failed) show(text); },
  onRuntimeInitialized: function () { if (!Module.failed) show(''); },
  onAbort: function (what) { Module.failed = true; show('Lumora stopped: ' + what); },
};
if (!navigator.gpu) { Module.failed = true; show('This page needs a browser with WebGPU.'); }
</script>
{{{ SCRIPT }}}
</body>
</html>
